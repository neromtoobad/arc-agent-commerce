[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
# These settings match the contracts deployed and verified on Arc mainnet (exact match).
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 500

[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
arc_testnet = "${ARC_TESTNET_RPC}"
